<g><rect x="311" y="232" width="88" height="34" rx="11" fill="#06B6D4" opacity="0.14" stroke="#06B6D4" stroke-opacity="0.6"/><text x="355" y="254" text-anchor="middle" fill="#18152B" font-size="12" font-weight="700">Node.js</text></g>
<g><rect x="409" y="232" width="88" height="34" rx="11" fill="#EC4899" opacity="0.14" stroke="#EC4899" stroke-opacity="0.6"/><text x="453" y="254" text-anchor="middle" fill="#18152B" font-size="12" font-weight="700">Express</text></g>
<g><rect x="507" y="232" width="139.5" height="34" rx="11" fill="#A3FF12" opacity="0.14" stroke="#A3FF12" stroke-opacity="0.6"/><text x="576.75" y="254" text-anchor="middle" fill="#18152B" font-size="12" font-weight="700">Interactive Web</text></g>
      <g transform="translate(867,44)">
        <rect width="196" height="42" rx="13" fill="#FFFFFF" stroke="#DCD6F7"/>
