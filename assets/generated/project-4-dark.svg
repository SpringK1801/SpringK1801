<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="304" viewBox="0 0 1100 304" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft Mods project</title>
  <desc id="desc">Minecraft Mods project</desc>
  <defs>
    
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="neon-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2A2E55" stroke-width="1" opacity="0.38"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .project-arrow { animation: nudge 2.4s ease-in-out infinite; } @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(7px); } } @media (prefers-reduced-motion: reduce) { .project-arrow { animation: none; } }
  </style>
  
      <rect x="1.5" y="1.5" width="1097" height="301" rx="25" fill="#070816" stroke="url(#neon)" stroke-width="3"/>
      <rect x="2" y="2" width="1096" height="300" rx="24" fill="url(#grid)" opacity="0.45"/>
      <rect x="34" y="42" width="126" height="126" rx="28" fill="#101329" stroke="#06B6D4" stroke-opacity="0.65"/>
      <rect x="51" y="59" width="92" height="92" rx="20" fill="url(#neon)" opacity="0.15"/>
      <g color="#F8FAFF"><image x="45" y="53" width="104" height="104" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/></g>
      <text x="198" y="61" fill="#06B6D4" font-size="12" font-weight="800" letter-spacing="2.2">PROJECT</text>
