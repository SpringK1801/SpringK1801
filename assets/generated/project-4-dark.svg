<g><rect x="401.7" y="232" width="88" height="34" rx="11" fill="#EC4899" opacity="0.14" stroke="#EC4899" stroke-opacity="0.6"/><text x="445.7" y="254" text-anchor="middle" fill="#F8FAFF" font-size="12" font-weight="700">Add-ons</text></g>
      <g transform="translate(867,44)">
        <rect width="196" height="42" rx="13" fill="#101329" stroke="#2A2E55"/>
