<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="132" viewBox="0 0 1100 132" role="img" aria-labelledby="title desc">
  <title id="title">Spring profile footer</title>
  <desc id="desc">Spring profile footer</desc>
  <defs>
    
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="neon-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2A2E55" stroke-width="1" opacity="0.38"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scan { animation: scan 5s ease-in-out infinite; } @keyframes scan { 0%,100% { transform: translateX(-180px); opacity: .2; } 50% { transform: translateX(1080px); opacity: .8; } } @media (prefers-reduced-motion: reduce) { .scan { animation: none; opacity: .45; } }
  </style>
  
      <rect x="1" y="1" width="1098" height="130" rx="24" fill="#070816" stroke="#2A2E55"/>
      <path d="M28 71 H240 L260 49 L280 91 L303 62 L325 71 H506 L525 56 L545 84 L566 71 H760 L778 53 L798 87 L818 71 H1072" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.8"/>
      <rect class="scan" x="0" y="28" width="150" height="76" rx="38" fill="url(#neon-soft)"/>
      <rect x="414" y="42" width="272" height="58" rx="18" fill="#101329" stroke="#2A2E55"/>
      <text x="550" y="66" text-anchor="middle" fill="#F8FAFF" font-size="14" font-weight="800" letter-spacing="2">BUILD · BREAK · LEARN</text>
      <text x="550" y="86" text-anchor="middle" fill="#6F739D" font-size="12" font-weight="650">THEN BUILD IT BETTER</text>
</svg>
